# Official text, copied verbatim (line breaks joined): "Sobre VE sin Filtro" / "About VE sin Filtro",
# page 1 of the 2025 report Redes de control (res/files/informe-presidenciales-2024-vesinfiltro.pdf)
# and its English edition Networks of control (res/files/digital_repression-venezuela_elections-VEsinFiltro.pdf).
# The two versions are not identical: the English one adds a sentence on network measurements and words the last paragraph differently.
es:
  titulo: Sobre VE sin Filtro
  parrafos:
    - VE sin Filtro es un programa dedicado al monitoreo y documentación de amenazas al ejercicio de los derechos humanos en el entorno digital en Venezuela, creado por la organización de derechos digitales Conexión Segura y Libre.
    - Desde 2014, ha ayudado a identificar y evadir la censura en internet, siendo pionero en la región. Con evidencia técnica y análisis de datos, expone y documenta el alcance de los bloqueos y la censura en internet, la vigilancia gubernamental indiscriminada y los ciberataques contra la sociedad civil. VE sin Filtro ha podido atribuir ataques digitales contra la sociedad civil al gobierno de Venezuela.
    - Mediante un monitoreo constante, VE sin Filtro provee actualizaciones en tiempo real sobre el estado del internet en Venezuela. Este trabajo no solo se enfoca en la conectividad y el acceso desigual a internet, sino también en el seguimiento de interrupciones de servicio, Internet shutdowns, ataques y bloqueos, con el propósito de proteger el acceso a la información, la libertad de expresión, la privacidad, la seguridad, la educación, la participación, entre otros derechos fundamentales.
    - Conexión Segura y Libre ofrece asistencia de emergencia a organizaciones de la sociedad civil, periodistas y medios independientes que estén siendo atacados o hayan sido recientemente bloqueados, ayudando a resolver el incidente y mitigar el impacto de la censura. También brinda soporte y capacitación a activistas, periodistas y organizaciones, y elabora recomendaciones y mejores prácticas para contrarrestar las amenazas contra sus derechos y su seguridad.
    - Conexión Segura y Libre creó Noticias Sin Filtro, un lector de noticias resistente a la censura para facilitar el acceso a medios locales independientes en Venezuela.
    - El programa VE sin Filtro ganó el Premio FRIDA por una Internet Libre y Abierta, otorgado por LACNIC. Y ha sido citado en informes de otras organizaciones de derechos humanos y citado por medios como Time, The Washington Post y El País.
    - Las restricciones a los derechos humanos documentadas por Conexión Segura y Libre han sido fundamentales para denuncias al Estado venezolano por el uso abusivo de sus potestades, por la aplicación de censura previa contra contenidos de interés público, y por la falta de políticas que garanticen el acceso a internet.
en:
  titulo: About VE sin Filtro
  parrafos:
    - VE sin Filtro is a program dedicated to monitoring and documenting threats to the exercise of human rights in the digital environment in Venezuela, created by the digital human rights organization Conexión Segura y Libre (Free and Secure Online).
    - Since 2014 it has helped identify and circumvent media censorship and has pioneered the joint use of automated network measurements, volunteer-contributed tests, and network traffic analysis to document internet censorship. VE sin Filtro has used open-source investigations to examine restrictions on human rights online to attribute state-sponsored digital attacks in Venezuela. With technical evidence and data analysis, it exposes and documents the extent of internet blocking and censorship, indiscriminate government surveillance and cyber-attacks against civil society.
    - Through constant monitoring, VE sin Filtro provides real-time updates on the state of the Internet in Venezuela. This work not only focuses on connectivity and unequal access to the Internet, but also on the monitoring of service interruptions, Internet shutdowns, attacks and blocks, with the purpose of protecting access to information, freedom of expression, privacy, security, education, participation, among other fundamental rights.
    - Conexión Segura y Libre offers emergency assistance to civil society organizations, journalists and independent media under attack or recently blocked; helping to resolve the incident and mitigating the impact of censorship; and provides support and training to activists, journalists and organizations, and develops recommendations and best practices to counter threats to their rights and safety.
    - Conexión Segura y Libre created Noticias Sin Filtro, a resilient anti-censorship newsreader to facilitate access to local independent news in Venezuela.
    - The VE sin Filtro program won the FRIDA Prize for a Free and Open Internet, awarded by LACNIC. Its work is considered in the reports of other Human Rights organizations and cited by Time, The Washington Post and El País.
    - Human rights restrictions documented by Conexión Segura y Libre have been cited by local and international organizations, as well as human rights bodies, to report abuses of power, censorship of content in the public interest, and the lack of policies ensuring equitable access to the Internet in Venezuela.
